[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wkp-hsi-headwall"
version = "0.1.0"
description = "Simple hyperspectral file readers and viewers, starting with EVK HELIOS EIFF scans"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
hsi-helios-eiff = "wkp_hsi.helios_eiff.viewer:main"
hsi-helios-eiff-export = "wkp_hsi.helios_eiff.export:main"

[tool.setuptools.packages.find]
where = ["src"]
